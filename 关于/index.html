<style>
    .loading {
        position: fixed;
         
         
         
        display: none;
        justify-content: center;
        align-items: center;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        zoom: 3.0;
        overflow: hidden;
    }

     
    .loading-bg {
        position: absolute;
        inset: 0;

        background: #000;

        z-index: 0;
    }

     
    .bgFadeout {
        animation: bgFadeOut 1.5s forwards;
    }

    @keyframes bgFadeOut {
        0% {
            transform: scale(1);
            opacity: 0.6;
        }
        90% {
            opacity: 0.6;
        }
        100% {
            transform: scale(1.5);
            opacity: 0;
        }
    }
    
     
    .loader-spin-out {
         
        animation: spinAndShrink 1.5s forwards ease-in-out !important;
    }

    @keyframes spinAndShrink {
        0% {
            transform: rotate(0deg) scale(1);
            opacity: 1;
        }

        70% {
             
            transform: rotate(-1080deg) scale(1);
            opacity: 1;
        }

        100% {
             
            transform: scale(1.5);
            opacity: 0;
        }
    }

     
    .sharingon {
        position: relative;
        z-index: 1;
        width: 6em;
        height: 6em;
        background-color: red;
        border: 6px solid rgb(0, 0, 0);
         
         
         
        box-shadow:
            0 0 25px rgba(255, 0, 0, 0.4),
            0 0 60px rgba(255, 0, 0, 0.2);
        border-radius: 50%;
        animation: rot 1s linear infinite;  
    }

    .ring {
        position: absolute;
        content: "";
        left: 50%;
        top: 50%;
        width: 3.5em;
        height: 3.5em;
        border: 4px solid rgb(110, 13 ,13 ,0.5);
        transform: translate(-50%,-50%);
    }

    .sharingon, .ring, .to,.circle {
        border-radius: 50%;
    }

    .to,.circle {
        position: absolute;
        content: "";
        width: 0.9em;
        height: 0.9em;
        background-color: black;
    }

    .to:nth-child(1) {
        top: -0.5em;
        left: 50%;
        transform: translate(-40%);
    }

    .to::before {
        content: "";
        position: absolute;
        top: -0.5em;
        right: -0.2em;
        width: 1.1em;
        height: 0.9em;
        box-sizing: border-box;
        border-left: 16px solid black;
        border-radius: 100% 0 0;
    }

    .to:nth-child(2) {
        bottom: 0.5em;
        left: -0.35em;
        transform: rotate(-120deg);
    }

    .to:nth-child(3) {
        bottom: 0.5em;
        right: -0.35em;
        transform: rotate(120deg);
    }

    .circle {
        top: 50%;
        left: 50%;
        transform: translate(-50%,-50%);
        background: black;
        box-shadow:
            0 0 10px rgba(255, 0, 0, 0.7),
            0 0 20px rgba(255, 0, 0, 0.4);
        width: 1em;
        height: 1em;
    }

    @keyframes rot {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

    function initLoading() {
        const isFirstVisit = !sessionStorage.getItem('visited');
        if (isFirstVisit) {
            let loading = document.querySelector(".loading");
            loading.style.display = "flex";
            document.addEventListener('DOMContentLoaded', function() {
                
                loadFinish();
                
                setTimeout(() => {
                    loading.style.display = "none";
                }, 1500)
                sessionStorage.setItem('visited', 'true');
            });
        }
    }
    
    function loadFinish() {
        
        let sharingon = document.querySelector(".sharingon");
        sharingon.classList.add("loader-spin-out");
        
        
        let loading = document.querySelector(".loading-bg");
        loading.classList.add("bgFadeout");
    }
    
    initLoading();
</script>

<script src="https://sloth-cyx.github.io/background/particles.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        
        
        function initParticles() {
            
            const container = document.getElementById('particles-js');
            if (container && container.childNodes.length === 0) {
                if (typeof particlesJS !== "undefined") {
                    particlesJS.load('particles-js', 'https:\/\/sloth-cyx.github.io\/background\/particlesjs-config.json', function () {});
                }
            }
        }

        function checkBackground() {
            const isDark = document.documentElement.getAttribute('data-scheme') === 'dark';
            
            
            if (isDark) {
                initParticles();
            }
        }

        
        window.addEventListener('load', () => {
            
            if (typeof Sakura !== "undefined") new Sakura('body');
            
            checkBackground();
        });

        
        const observer = new MutationObserver(checkBackground);
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-scheme'] });
            
        
        let toc = document.querySelector(".widget--toc");
        if (toc) {
            window.addEventListener('scroll', function () {
                let openUl = document.querySelectorAll(".open");
                if (openUl.length > 0) { openUl.forEach((ul) => { ul.classList.remove("open") }) }
                let currentLi = document.querySelector(".active-class");
                if (!currentLi) return;
                if (currentLi.children.length > 1) { currentLi.children[1].classList.add("open") }
                let ul = currentLi.parentElement;
                do {
                    ul.classList.add("open");
                    ul = ul.parentElement.parentElement
                } while (ul !== undefined && (ul.localName === 'ul' || ul.localName === 'ol'))
            });
        }

        
        let rightSideBar = document.querySelector(".right-sidebar");
        if (rightSideBar) {
            let btn = document.createElement("div");
            btn.id = "backTopBtn";
            btn.onclick = function () { window.scrollTo({ top: 0, behavior: "smooth" }); };
            rightSideBar.appendChild(btn);
            window.addEventListener('scroll', function () {
                if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) { btn.style.display = "block"; }
                else { btn.style.display = "none"; }
            });
        }

        
        let blockquotes = document.querySelectorAll("blockquote");
        blockquotes.forEach(function (bq) {
            
            let text = bq.textContent || bq.innerText;
            let alertType = "";

            
            if (text.includes("[!NOTE]")) { alertType = "note"; }
            else if (text.includes("[!TIP]")) { alertType = "tip"; }
            else if (text.includes("[!WARN]")) { alertType = "warn"; }
            else if (text.includes("[!ERROR]")) { alertType = "error"; }
            else if (text.includes("[!VIOLET]")) { alertType = "violet"; }

            if (alertType) {
                
                bq.classList.add("alert", "alert-" + alertType);

                
                let pTag = bq.querySelector("p");
                if (pTag) {
                    
                    let token = "[!" + alertType.toUpperCase() + "]";
                    if (pTag.innerText.startsWith(token)) {
                        pTag.innerText = pTag.innerText.substring(token.length).trim();
                    } else {
                        
                        pTag.innerText = pTag.innerText.replace(/\[!(NOTE|TIP|WARN|ERROR|VIOLET)\]/g, "").trim();
                    }
                }
            }
        });
    });
</script>
